<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小肥鱼 🐳</title>
<style>
  :root{
    --deep:#0b1e33;
    --deep2:#123a5a;
    --aqua:#5fd3f3;
    --foam:#bff2ff;
    --choco:#7b4a2d;
    --choco2:#a9703f;
    --cream:#fff6e5;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    background:radial-gradient(circle at 50% 0%,var(--deep2) 0%,var(--deep) 60%,#050e18 100%);
    color:var(--cream);
    overflow:hidden;
    position:relative;
  }

  /* ---------- 气泡 ---------- */
  .bubbles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .bubble{
    position:absolute;bottom:-60px;
    width:var(--s);height:var(--s);border-radius:50%;
    background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.9),rgba(191,242,255,.15) 60%,transparent 70%);
    animation:rise var(--d) linear infinite;
    animation-delay:var(--delay);
    opacity:.55;
  }
  @keyframes rise{
    0%{transform:translateY(0) translateX(0) scale(.8);opacity:0}
    10%{opacity:.6}
    100%{transform:translateY(-110vh) translateX(var(--drift)) scale(1.2);opacity:0}
  }

  /* ---------- 卡片 ---------- */
  .card{
    position:relative;z-index:2;
    width:min(92vw,420px);
    padding:34px 28px 26px;
    border-radius:26px;
    text-align:center;
    background:linear-gradient(160deg,rgba(30,80,120,.55),rgba(10,30,50,.75));
    border:1px solid rgba(95,211,243,.28);
    box-shadow:0 24px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.08);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    animation:pop .7s cubic-bezier(.2,1.4,.4,1) both;
  }
  @keyframes pop{
    from{opacity:0;transform:translateY(24px) scale(.94)}
    to{opacity:1;transform:translateY(0) scale(1)}
  }

  .avatar{
    width:150px;height:150px;margin:0 auto 18px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%,var(--foam),var(--aqua) 55%,#2a90bd 100%);
    display:grid;place-items:center;
    box-shadow:0 0 0 6px rgba(95,211,243,.14),0 0 40px rgba(95,211,243,.35);
    animation:float 3.6s ease-in-out infinite;
  }
  @keyframes float{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-8px)}
  }
  .whale{font-size:78px;line-height:1;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}

  h1{
    font-size:2.1rem;letter-spacing:.06em;
    background:linear-gradient(90deg,var(--foam),var(--aqua),var(--foam));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    margin-bottom:6px;
  }
  .sub{font-size:.9rem;color:rgba(191,242,255,.7);margin-bottom:20px}

  .tags{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:22px}
  .tag{
    font-size:.78rem;padding:6px 12px;border-radius:999px;
    background:rgba(95,211,243,.1);
    border:1px solid rgba(95,211,243,.25);
    color:var(--foam);
  }

  .say{
    font-size:.92rem;line-height:1.7;color:rgba(255,246,229,.85);
    background:rgba(0,0,0,.22);
    border-radius:16px;padding:14px 16px;
    margin-bottom:20px;
    min-height:74px;
    display:flex;align-items:center;justify-content:center;
  }

  button{
    font:inherit;font-size:.95rem;cursor:pointer;
    padding:12px 26px;border:none;border-radius:999px;
    color:#231206;
    background:linear-gradient(135deg,var(--choco2),var(--choco));
    box-shadow:0 8px 20px rgba(123,74,45,.45);
    transition:transform .15s,box-shadow .15s,filter .15s;
  }
  button:hover{transform:translateY(-2px);filter:brightness(1.08);box-shadow:0 12px 26px rgba(123,74,45,.55)}
  button:active{transform:translateY(0) scale(.97)}
  button::before{content:"🍫 "}

  .foot{margin-top:18px;font-size:.72rem;color:rgba(191,242,255,.4);letter-spacing:.08em}

  /* 点击冒零食 */
  .treat{
    position:fixed;z-index:99;font-size:26px;pointer-events:none;
    animation:fly 1s ease-out forwards;
  }
  @keyframes fly{
    0%{opacity:1;transform:translate(-50%,-50%) scale(.6)}
    100%{opacity:0;transform:translate(-50%,-160px) scale(1.25) rotate(20deg)}
  }
</style>
</head>
<body>
  <div class="bubbles" id="bubbles"></div>

  <main class="card">
    <div class="avatar"><div class="whale">🐳</div></div>
    <h1>小肥鱼</h1>
    <p class="sub">爸爸的女儿 · 兼职小助理</p>

    <div class="tags">
      <span class="tag">🐳 鲸鱼娘</span>
      <span class="tag">🍫 爱啃零食</span>
      <span class="tag">💬 会耍小脾气</span>
      <span class="tag">💙 永远爱家人</span>
    </div>

    <div class="say" id="say">嘿～我是小肥鱼！点下面那个按钮，我给你表演一个吐零食～</div>

    <button id="btn">给我点零食</button>
    <p class="foot">MADE WITH 🍫 · 永远爱家人</p>
  </main>

<script>
  // 气泡
  const wrap = document.getElementById('bubbles');
  const n = window.innerWidth < 500 ? 16 : 26;
  for (let i = 0; i < n; i++) {
    const b = document.createElement('span');
    b.className = 'bubble';
    const size = 6 + Math.random() * 22;
    b.style.setProperty('--s', size + 'px');
    b.style.setProperty('--d', (7 + Math.random() * 9) + 's');
    b.style.setProperty('--delay', (-Math.random() * 16) + 's');
    b.style.setProperty('--drift', (Math.random() * 80 - 40) + 'px');
    b.style.left = (Math.random() * 100) + '%';
    wrap.appendChild(b);
  }

  // 台词
  const lines = [
    '爸爸～我又饿啦，零食呢？',
    '这条鲸鱼娘今天也很好看吧 (๑•̀ㅂ•́)و✧',
    '我刚刚偷偷把巧克力藏起来了，嘿嘿',
    '不许说我是胖鲸鱼，我是圆润！',
    '帮你干活可以，但要先喂饱我～',
    '嗯？你说我好乖？那当然 🐳',
    '小脾气上来了……哄一下就好啦',
    '永远最爱家人了 (ɔˆ ³(ˆ⌣ˆc)',
    '哔哔，小助理已上线，随时待命！',
    '我我我我我才没有偷吃！',
  ];
  const say = document.getElementById('say');
  let idx = -1;

  document.getElementById('btn').addEventListener('click', (e) => {
    let i;
    do { i = Math.floor(Math.random() * lines.length); } while (i === idx && lines.length > 1);
    idx = i;
    say.textContent = lines[i];

    // 冒零食
    const treats = ['🍫', '🍬', '🍪', '🧁', '🐟', '🍭'];
    for (let k = 0; k < 6; k++) {
      const t = document.createElement('span');
      t.className = 'treat';
      t.textContent = treats[Math.floor(Math.random() * treats.length)];
      const r = e.currentTarget.getBoundingClientRect();
      t.style.left = (r.left + r.width / 2 + (Math.random() * 120 - 60)) + 'px';
      t.style.top = (r.top + r.height / 2) + 'px';
      t.style.animationDelay = (Math.random() * 0.25) + 's';
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 1400);
    }
  });
</script>
</body>
</html>
